<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h1>My calculator</h1>
    <div class="container">
        <input class="display" id="displayField" disabled>

        <div class="clear">
            <button id="clear" onclick="clearDisplay()">C</button>
            <button id="delete" onclick="deleteChar()"> del</button>
            <button class="divide" onclick="appendChar('/')">/</button>
        </div>
        <div class="keypads">
            <div class="numbers-box">
                <div class="row">
                    <button onclick="appendChar('7')" class="numbers">7</button>
                    <button onclick="appendChar('8')" class="numbers">8</button>
                    <button onclick="appendChar('9')" class="numbers">9</button>
                </div>
                <div class="row">
                    <button onclick="appendChar('4')" class="numbers">4</button>
                    <button onclick="appendChar('5')" class="numbers">5</button>
                    <button onclick="appendChar('6')" class="numbers">6</button>
                </div>
                <div class="row">
                    <button onclick="appendChar('1')" class="numbers">1</button>
                    <button onclick="appendChar('2')" class="numbers">2</button>
                    <button onclick="appendChar('3')" class="numbers">3</button>
                </div>
                <div class="first-row">
                    <button onclick="appendChar('0')" class="zero">0</button>
                </div>
            </div>
            <div class="operators">
                <button onclick="appendChar('*')">*</button>
                <button onclick="appendChar('-')">-</button>
                <button onclick="appendChar('+')">+</button>
                <button onclick="calculate()">=</button>
            </div>
        </div>
    </div>


    <script src="index.js"></script>
</body>

</html>
